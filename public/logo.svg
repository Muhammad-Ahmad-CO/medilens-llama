<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="MediLens logo">
  <!-- Lens: the scan. -->
  <circle cx="22" cy="22" r="17" fill="#ffffff" stroke="#0E7A5F" stroke-width="4"/>
  <!-- Capsule: the medicine, tilted like a pack held up to the light.
       Left half filled, right half open — the two halves of one capsule. -->
  <g transform="rotate(-35 22 22)">
    <path d="M22 18.5 H15.5 A3.5 3.5 0 0 0 15.5 25.5 H22 Z" fill="#0E7A5F"/>
    <rect x="12" y="18.5" width="20" height="7" rx="3.5" fill="none" stroke="#0E7A5F" stroke-width="2"/>
  </g>
  <!-- Verified check: the verdict — genuine. -->
  <circle cx="36" cy="36" r="8" fill="#0E7A5F" stroke="#ffffff" stroke-width="2"/>
  <path d="M32.5 36 L35 38.5 L39.5 33.5" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
